[project]
name = "incidentlens"
version = "1.0.0"
description = "AI điều tra sự cố: định tuyến cảnh báo, điều tra tự động, trí nhớ sự cố, hành động có người duyệt, báo cáo ROI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/config", "/examples", "/scripts", "/docs", "/README.md", "/pyproject.toml", "/Dockerfile", "/docker-compose.yml", "/.env.example", "/.dockerignore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
