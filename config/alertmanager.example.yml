# Sample Alertmanager configuration forwarding alerts to IncidentLens.
# Alertmanager handles initial grouping and repeat intervals before webhook delivery.
route:
  receiver: incidentlens
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: incidentlens
    webhook_configs:
      - url: http://incidentlens:8000/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: CHANGE_ME   # must match IL_WEBHOOK_TOKEN
