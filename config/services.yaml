# Service catalog.
#   team        owning team (shown in digests and postmortems)
#   repo        GitHub repository (org/repo) for deployment correlation
#   depends_on  upstream/downstream dependencies checked for cascading alerts
#   runbook     runbook URL rendered as a button on Slack investigation cards
services:
  auth-service:
    team: Platform Team
    repo: your-org/auth-service
    depends_on: [user-db]
    runbook: https://wiki.example.com/runbooks/auth-service
  user-profile-service:
    team: Platform Team
    repo: your-org/user-profile-service
    depends_on: [auth-service]
  payment-worker:
    team: Payment Team
    repo: your-org/payment-worker
  user-db:
    team: Infra Team
  db-replica-02:
    team: Infra Team
