# Danh mục dịch vụ.
#   team        đội phụ trách (hiển thị trong digest, postmortem)
#   repo        repo GitHub để liên kết deploy gần đây
#   depends_on  dịch vụ mà nó phụ thuộc: nếu các dịch vụ này đang có cảnh báo, đó là bằng chứng sự cố lan truyền
#   runbook     link runbook, hiện thành nút trên thẻ điều tra
services:
  auth-service:
    team: Platform Team
    repo: your-org/auth-service
    depends_on: [user-db]
    runbook: https://wiki.example.com/runbooks/auth-service
  user-profile-service:
    team: Platform Team
    repo: your-org/user-profile-service
    depends_on: [auth-service]
  payment-worker:
    team: Payment Team
    repo: your-org/payment-worker
  user-db:
    team: Infra Team
  db-replica-02:
    team: Infra Team
