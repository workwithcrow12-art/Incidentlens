# Allowlist of remediation actions invokable from verified Slack buttons.
# - Only Slack user IDs listed in `approvers` are authorized; an empty list denies everyone.
# - Commands execute as argument lists without a shell. {service} is replaced after safe-name validation.
# - Disabled by default (IL_ACTIONS_ENABLED=false): previews the command without executing it.
# - Grant the IncidentLens host minimal RBAC scoped strictly to the allowlisted commands below.

actions:
  rollback:
    label: "🔄 Rollback"
    command: ["kubectl", "rollout", "undo", "deployment/{service}", "-n", "production"]
    services: ["auth-service", "payment-worker"]
    approvers: []          # example: ["U012ABCDEF", "U034GHIJKL"]
    confirm: "Roll back `{service}` to the previous revision? Capture a memory dump first if root-cause forensics are needed."
    timeout_seconds: 120
    cooldown_seconds: 300

  restart:
    label: "♻️ Restart"
    command: ["kubectl", "rollout", "restart", "deployment/{service}", "-n", "production"]
    services: ["*"]
    approvers: []
    confirm: "Restart all pods of `{service}`? In-memory state will be lost."
    timeout_seconds: 120
    cooldown_seconds: 300
