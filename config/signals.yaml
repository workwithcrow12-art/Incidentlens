# Signals checked by the investigation engine during an incident (read-only access to Prometheus and Loki).
# Each signal compares a pre-incident baseline window against the active incident window.
#   {service}  replaced with the validated service name
#   min_ratio  minimum relative change required to flag an anomaly
#   min_abs    minimum absolute difference required (suppresses near-zero noise)
# Adapt these sample queries to match your metric names and label conventions.

baseline_minutes: 60   # compare against the 60 minutes prior to incident onset
guard_minutes: 5       # start the active window 5 minutes before the alert fired

signals:
  - name: error_rate
    title: 5xx error rate
    category: errors
    unit: ratio
    min_ratio: 2
    min_abs: 0.01
    query: 'sum(rate(http_requests_total{service="{service}",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="{service}"}[5m]))'

  - name: latency_p95
    title: p95 latency
    category: latency
    unit: s
    min_ratio: 2
    min_abs: 0.05
    query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="{service}"}[5m])))'

  - name: memory
    title: Memory usage
    category: saturation
    unit: bytes
    min_ratio: 1.5
    min_abs: 104857600   # 100 MB
    query: 'max(container_memory_working_set_bytes{pod=~"{service}-.*",container!=""})'

  - name: cpu
    title: CPU usage (cores)
    category: saturation
    min_ratio: 2
    min_abs: 0.2
    query: 'sum(rate(container_cpu_usage_seconds_total{pod=~"{service}-.*",container!=""}[5m]))'

  - name: restarts
    title: Pod restarts
    category: restarts
    min_ratio: 2
    min_abs: 1
    query: 'sum(increase(kube_pod_container_status_restarts_total{pod=~"{service}-.*"}[10m]))'

logs:
  min_lines: 5
  query: '{service="{service}"} |~ "(?i)(error|exception|fatal|panic)"'
