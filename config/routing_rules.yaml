# Alert routing rules — authored and reviewed by humans; never modified by an LLM.
# Evaluated top to bottom; the first matching rule determines severity.
#   match:    exact label match
#   match_re: full-value regex label match
# Severities: critical (🔴 page immediately) · action (🟡 include in digest) · info (⚪ record only)

default_severity: info

rules:
  - name: critical-label
    match: { severity: critical }
    severity: critical

  - name: slo-burn
    match_re: { alertname: "SLO.*BurnRate.*" }
    severity: critical

  - name: security
    match: { category: security }
    severity: critical

  - name: warning-label
    match: { severity: warning }
    severity: action

  - name: info-label
    match: { severity: info }
    severity: info

# Escalation policy: 🟡 action alerts automatically promote to 🔴 and page on-call when:
escalation:
  max_pending_minutes: 240   # still firing after this many minutes
  max_receive_count: null    # or received at least N times (null = disabled)
